name: facturex-app

services:
  facturex-tomcat:
    build:
      context: ./tomcat
    container_name: facturex-tomcat
    restart: always
    ports:
      - "8080:8080"
    networks:
      - snet
    depends_on:
      facturex-database:
        condition: service_healthy
    volumes:
      - ./war:/usr/local/tomcat/webapps
      - ./logs/server:/usr/local/tomcat/logs
      - ./logs/apps:/opt/tomcat/logs
      - ./apk:/opt/apk

  facturex-database:
    build: 
      context: ./database
    container_name: facturex-postgres
    restart: always
    ports: 
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: postgres
      POSTGRES_HOST: facturex-database
      POSTGRES_MULTIPLE_DATABASES: faturex_db
    networks:
      - snet
    volumes:
      - db_data:/opt/postgres/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  facturex-web:
    build: 
      context: ./nginx
    container_name: facturex-web
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - facturex-tomcat
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - snet

networks:
  snet:
    driver: bridge

volumes:
  db_data: